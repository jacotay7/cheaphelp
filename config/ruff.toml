target-version = "py310"
line-length = 120
output-format = "concise"

[lint]
exclude = [
    "tests/fixtures/*.py",
]
select = ["ALL"]
ignore = [
    "A001",  # Variable is shadowing a Python builtin
    "ANN204",  # Missing return type annotation for special method __str__
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ARG005",  # Unused lambda argument
    "C901",  # Too complex
    "D105",  # Missing docstring in magic method
    "D417",  # Missing argument description in the docstring
    "E501",  # Line too long
    "EM101",  # String literal when raising exception
    "EM102",  # f-string when raising exception
    "ERA001",  # Commented out code
    "FIX",  # TODO, FIXME, etc.
    "G004",  # Logging statement uses f-string
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments to function call
    "PLR0915",  # Too many statements
    "PERF203",  # try-except in loop (clarity over micro-perf here)
    "PERF401",  # Manual list comprehension
    "PYI034",  # __enter__ return type (Self not available on py310 target)
    "FBT001",  # Boolean-typed positional argument
    "FBT002",  # Boolean default positional argument
    "FBT003",  # Boolean positional value in call
    "S603",  # subprocess call: we invoke trusted tools (git, systemctl, opencode)
    "S607",  # Starting a process with a partial path: PATH lookup is intended
    "TC001",  # Move first-party import into type-checking block
    "TC002",  # Move third-party import into type-checking block
    "TC003",  # Move stdlib import into type-checking block (we use __future__ annotations)
    "SLF001", # Private member accessed
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link for TODO
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[lint.per-file-ignores]
"src/**/cli.py" = [
    "T201",  # Print statement
]
"src/*/debug.py" = [
    "T201",  # Print statement
]
"src/**/commands.py" = [
    "T201",  # Print statement (CLI user-facing output)
    "ARG001",  # Unused argument (handlers share the (args) signature)
]
"src/**/orchestrator.py" = [
    "T201",  # Print statement (fallback logger)
]
"src/**/env.py" = [
    "S105",  # Possible hardcoded password: these are env var *key names*
]
"!src/*/*.py" = [
    "D100",  # Missing docstring in public module
]
"!src/**.py" = [
    "D101",  # Missing docstring in public class
    "D103",  # Missing docstring in public function
]
"scripts/*.py" = [
    "INP001",  # File is part of an implicit namespace package
    "T201",  # Print statement
]
"tests/**.py" = [
    "ARG001",  # Unused function argument (monkeypatch stubs mirror real signatures)
    "ARG005",  # Unused lambda argument
    "D102",  # Missing docstring in public method (test doubles mirror documented APIs)
    "D107",  # Missing docstring in __init__ (test doubles mirror documented APIs)
    "FBT001",  # Boolean positional arg in function definition
    "PLR2004",  # Magic value used in comparison
    "S101",  # Use of assert detected
    "S105",  # Hardcoded password: test fixtures use token *key names*
    "S106",  # Hardcoded password in function argument: test fixtures pass fake tokens to clients
]

[lint.flake8-quotes]
docstring-quotes = "double"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
known-first-party = ["cheaphelp"]

[lint.pydocstyle]
convention = "google"

[format]
exclude = [
    "tests/fixtures/*.py",
]
docstring-code-format = true
docstring-code-line-length = 80
